# File entries are names relative to configs/, linked to the same name in HOME.
# Overlay [files] entries resolve beneath DOTFILES_PRIVATE/configs/.
[files]
.bashrc
.curlrc
.gitconfig
.p10k.zsh
.prettierignore
.prettierrc.json
.profile
.wgetrc
.zshenv
.zshrc

# Path format: source-relative-to-clone | target-relative-to-HOME |
# Overlay sources starting with private/ resolve beneath DOTFILES_PRIVATE.
# Sources and targets must be relative paths without parent traversal.
[paths]
# Git
configs/git/ignore | .config/git/ignore
configs/git/attributes | .config/git/attributes
configs/git/message | .config/git/message

# Glow markdown pager
configs/glow/glow.yml | .config/glow/glow.yml

# mise runtime manager
configs/mise/config.toml | .config/mise/config.toml

# Fastfetch
configs/fastfetch/config-dotfiles.jsonc | .config/fastfetch/config-dotfiles.jsonc

# Starship Prompt
configs/starship.toml | .config/starship.toml

# Lazygit
configs/lazygit | .config/lazygit

# Btop System Monitor
configs/btop/btop.conf | .config/btop/btop.conf


# Bat syntax highlighter
configs/bat/config | .config/bat/config
configs/bat/themes | .config/bat/themes

# Micro editor (Ctrl+W quits: niri owns Ctrl+Q)
configs/micro/settings.json | .config/micro/settings.json
configs/micro/bindings.json | .config/micro/bindings.json
configs/micro/colorschemes | .config/micro/colorschemes

# VS Code
.vscode/settings.json | .config/Code/User/settings.json
.vscode/keybindings.json | .config/Code/User/keybindings.json
.vscode/snippets | .config/Code/User/snippets

# Terminal Emulators
configs/ghostty/config | .config/ghostty/config
configs/ghostty/overrides.conf | .config/ghostty/overrides.conf
configs/ghostty/themes/terminal-noir-dark | .config/ghostty/themes/terminal-noir-dark
configs/ghostty/themes/terminal-noir-light | .config/ghostty/themes/terminal-noir-light

# Neovim
configs/nvim | .config/nvim

# Tmux
configs/tmux/tmux.conf | .config/tmux/tmux.conf

# GTK dark theme (GTK3 needs settings.ini since Niri has no XSettings daemon)
configs/gtk-3.0/settings.ini | .config/gtk-3.0/settings.ini
configs/gtk-4.0/settings.ini | .config/gtk-4.0/settings.ini
configs/gtk-4.0/gtk.css | .config/gtk-4.0/gtk.css

# Chromium-family dark mode (force dark UI)
# chrome/electron read these flag files; chromium (plain ELF) needs the
# .desktop override since it does not read a flags.conf.
configs/chrome-flags.conf | .config/chrome-flags.conf
configs/electron-flags.conf | .config/electron-flags.conf
configs/electron40-flags.conf | .config/electron40-flags.conf
configs/applications/chromium.desktop | .local/share/applications/chromium.desktop
configs/applications/google-chrome.desktop | .local/share/applications/google-chrome.desktop

# Additional paths only for Arch Linux and derivatives.
[paths:arch]

# fcitx5 input method: owns the us-intl/br switch (Alt+Space)
configs/fcitx5/config | .config/fcitx5/config

# espanso text expander (Wayland build).
# Install + capability + service: dotfiles setup:run espanso
configs/espanso | .config/espanso

# niri (file-level so the private overlay can replace private.kdl / monitor.kdl)
configs/niri/config.kdl | .config/niri/config.kdl |
configs/niri/monitor.kdl | .config/niri/monitor.kdl |
configs/niri/private.kdl | .config/niri/private.kdl |

# Umbriel (file-level so the private overlay can add private.toml next to them)
configs/umbriel/config.toml | .config/umbriel/config.toml |
configs/umbriel/base.toml | .config/umbriel/base.toml |

# Vicinae launcher: Terminal Noir theme and a versioned config. The GUI owns
# ~/.config/vicinae/settings.json (it rewrites that file); add
# "imports": ["dotfiles.json"] there to load this one.
configs/vicinae/themes/terminal-noir.toml | .local/share/vicinae/themes/terminal-noir.toml |
configs/vicinae/dotfiles.json | .config/vicinae/dotfiles.json |
# Vicinae script commands (Beaver Habits via bin/utils/beaverhabits)
configs/vicinae/scripts | .local/share/vicinae/scripts |

# Noctalia (file-level so the private overlay can replace bar.toml / plugins.toml)
configs/noctalia/config.toml | .config/noctalia/config.toml |
configs/noctalia/bar.toml | .config/noctalia/bar.toml |
configs/noctalia/plugins.toml | .config/noctalia/plugins.toml |
configs/noctalia/user-templates.toml | .config/noctalia/user-templates.toml |
configs/noctalia/palettes | .config/noctalia/palettes |

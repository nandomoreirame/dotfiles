[Settings]
# GTK4/libadwaita apps follow the portal color-scheme (set by sys-gtk-dark),
# so this file is a reinforcement for GTK4 apps that do not use libadwaita.
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Terminal-Noir
gtk-cursor-theme-name=capitaine-cursors
gtk-font-name=Noto Sans 10

[Settings]
# GTK3 has no portal color-scheme support and Niri runs no XSettings daemon,
# so GTK3 apps (e.g. CachyOS Hello) read their theme only from this file.
# adw-gtk3 ships light/dark as SEPARATE themes; prefer-dark-theme does NOT
# switch between them, so the dark variant must be named explicitly.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Terminal-Noir
gtk-cursor-theme-name=capitaine-cursors
gtk-font-name=Noto Sans 10

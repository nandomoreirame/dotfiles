# Prefix (Ctrl+Space belongs to the Niri app launcher and never reaches tmux)
set -g prefix C-b
bind C-b send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position bottom
# two status lines: the first is a half-height spacer (lower-half blocks in the bar color on the
# base color, so the bar looks half a row taller and the gap above it half a row), the second holds
# the tabs. The second is the default layout without the pane and session lists, keeping the
# mouse ranges so clicking a tab still works
set -g status 2
set -g status-format[0] "#[fg=#121214,bg=#0B0B0C]#{R:▄,#{client_width}}"
set -g status-format[1] "#[align=left range=left]#{T:status-left}#[norange default]#[list=on align=left]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right]#{T:status-right}#[norange default]"
set -g status-interval 5
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 80
set -g window-status-separator ""
setw -g monitor-activity on
set -g visual-activity off
set -g automatic-rename on
# a shell tab is named after the folder, anything else after the program (nvim, node, lazygit)
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Theme: Terminal Noir (dark). Colors come from configs/themes/terminal-noir and the Noctalia palette:
#   base #0B0B0C, raised #121214, elevated #18181B, selection #52525B, outline #6B6B74,
#   text #F4F4F5, muted #A1A1AA, amber #F5A623, info #79C0FF
set -g status-style "bg=#121214,fg=#A1A1AA"

set -g status-left ""

# tabs: square blocks joined by pointed arrows. The arrow carries the colors of the two neighbors:
# gray into amber, amber into gray and the last tab into the bar; a thin chevron separates two gray tabs
set -g window-status-format "#[fg=#6B6B74,bg=#18181B] #I #[fg=#A1A1AA]#W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,} #{?#{==:#{e|+:#{window_index},1},#{active_window_index}},#[fg=#18181B#,bg=#F5A623],#{?window_end_flag,#[fg=#18181B#,bg=#121214],#[fg=#6B6B74#,bg=#18181B]}}"
set -g window-status-current-format "#[fg=#0B0B0C,bg=#F5A623,bold] #I #W#{?window_zoomed_flag, Z,} #[nobold]#{?window_end_flag,#[fg=#F5A623#,bg=#121214],#[fg=#F5A623#,bg=#18181B]}"
set -g window-status-activity-style "fg=#F5A623"
set -g window-status-bell-style "fg=#F5A623,bold"

# right: folder, host and time, then the session block (amber, blue while the prefix is pressed)
set -g status-right "#[fg=#6B6B74]#{b:pane_current_path}  #[fg=#A1A1AA]#h  #[fg=#F4F4F5,bold]%H:%M  #{?client_prefix,#[bg=#79C0FF],#[bg=#F5A623]}#[fg=#0B0B0C,bold] #S "

# panes: quiet dividers, the active pane gets an amber border and the others are slightly dimmed
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-style "fg=#6B6B74"
set -g pane-active-border-style "fg=#F5A623"
set -g window-style "fg=#A1A1AA,bg=#0B0B0C"
set -g window-active-style "fg=#F4F4F5,bg=#0B0B0C"
set -g display-panes-colour "#6B6B74"
set -g display-panes-active-colour "#F5A623"

# messages, prompts, copy mode, popups and menus
set -g message-style "bg=#18181B,fg=#F5A623"
set -g message-command-style "bg=#18181B,fg=#F4F4F5"
set -g mode-style "bg=#52525B,fg=#F4F4F5"
set -g copy-mode-match-style "bg=#52525B,fg=#F4F4F5"
set -g copy-mode-current-match-style "bg=#F5A623,fg=#0B0B0C"
set -g popup-style "bg=#121214,fg=#F4F4F5"
set -g popup-border-style "fg=#6B6B74"
set -g popup-border-lines single
set -g menu-style "bg=#121214,fg=#F4F4F5"
set -g menu-border-style "fg=#6B6B74"
set -g menu-border-lines single
set -g menu-selected-style "bg=#F5A623,fg=#0B0B0C"
setw -g clock-mode-colour "#F5A623"

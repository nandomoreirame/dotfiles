"Ctrl+Alt+3" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Ctrl+Alt+2" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Alt+6" = { action = "spawn $HOME/.dotfiles/bin/utils/video-to-gif", repeat = false }

# ---- Session ----
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
"Mod+Alt+P" = { action = "output-toggle DP-1", repeat = false }

# ==============================================================================
# Layout
# New scrolling-layout windows start at half the output width. Without this
# setting, each application chooses its starting width. Stacked columns retain
# their most recently focused row when focus leaves and later returns.
# https://docs.noctalia.dev/umbriel/layout/
[layout]
# mode = "scrolling" # "scrolling", "dwindle", "master", or "stacking".
gap = 4
extent_presets = [0.33333, 0.5, 0.66667]

# What a tiled window's own maximize button does: "column" fills the column,
# "edges" fills the usable area without struts, gaps, or borders. The
# window-toggle-maximize action is unaffected.
# client_maximize = "column"

[layout.stacking]
# drop_zones = false # Disable edge and corner drop zones when dragging in the stacking layout.

[layout.scrolling]
default_extent_fraction = 0.33333
center_focused = "never"
# Center the window picked in the overview, as column-center would.
# center_on_overview_select = true

# A tab group shows one window at a time below a bar of titles, and stacks and
# resizes like any row of its column. Mod+W tabs the focused window with the
# windows stacked beside it; Mod+Shift+J/K move a tab out of its group or a
# window into one. Click, scroll, or drag a title to switch, reorder, or pull it
# out.
# [layout.tabs]
# default_display = "normal"
# new_tab_position = "after_active"
# middle_click_closes = true
#
# [appearance.tab_bar]
# style = "titles"         # "indicator" draws thin slots without titles
# height = 24
# gap = -1                 # space between bar and window; -1 follows layout.gap
# font = "sans 10"
# visible = true           # false hides every bar; tabs keep working
# hide_when_single = false
# max_tabs = 6            # show at most 6 slots; more tabs scroll
# overflow = "scroll"      # or "shrink" to fit every tab

# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ---- Ported from configs/niri/config.kdl (window sizes). Later rules win, so
# the floating webapps come after the 2/3 browser rule.
[[window_rule]]
match.is_focused = true
border_color_outer = "#F5A623"

[[window_rule]]
match.app_id = ["^[Ss]potify$", "^discord$", "^localsend$", "^1password$"]
default_floating = true

[[window_rule]]
match.app_id = "^(md[.]obsidian[.]Obsidian|obsidian)$"
default_scrolling_extent = 0.33333

# Browsers, editors, OBS Studio and Chrome webapps at 2/3.
[[window_rule]]
match.app_id = [
  "^(google-chrome|chromium|firefox|brave-browser|zen)",
  "^(code|com[.]microsoft[.]VSCode|[Cc]ursor|[Aa]ntigravity)$",
  "^com[.]obsproject[.]Studio$",
  "^chrome-",
]
default_scrolling_extent = 0.66667

[[window_rule]]
match.app_id = ["^chrome-youtube[.]com__-", "^chrome-music[.]youtube[.]com__-"]
default_floating = true
default_floating_size = { width = 0.66667, height = 0.8 }

[[window_rule]]
match.app_id = "^chrome-x[.]com__compose_post-"
default_floating = true
default_floating_size_px = { width = 589, height = 299 }

[[window_rule]]
match.app_id = "^btop-float$"
default_floating = true
default_floating_size_px = { width = 1000 }

[[window_rule]]
match.app_id = ["^gamescope$", "^com[.]libretro[.]RetroArch$"]
default_fullscreen = true

[[window_rule]]
match.app_id = "^org[.]gnome[.]NautilusPreviewer$"
default_floating = true
default_floating_size_px = { width = 1200, height = 720 }

# ---- Named scratchpads (replace bin/utils/niri-scratchpad) ----
[[scratchpad]]
name = "spotify"
spawn_when_empty = "spotify-launcher"
hide_when_empty = true

[[scratchpad]]
name = "youtube"
spawn_when_empty = "google-chrome-stable --app=https://youtube.com"
hide_when_empty = true

[[scratchpad]]
name = "youtube-music"
spawn_when_empty = "google-chrome-stable --app=https://music.youtube.com"
hide_when_empty = true

[[scratchpad]]
name = "obsidian"
spawn_when_empty = "obsidian"
hide_when_empty = true

[[scratchpad]]
name = "discord"
spawn_when_empty = "discord"
hide_when_empty = true

[[scratchpad]]
name = "localsend"
spawn_when_empty = "localsend"
hide_when_empty = true

[[scratchpad]]
name = "x-post"
spawn_when_empty = "google-chrome-stable --app=https://x.com/compose/post"
hide_when_empty = true

[[window_rule]]
match.app_id = "^[Ss]potify$"
default_scratchpad = "spotify"
default_focused = true

[[window_rule]]
match.app_id = "^chrome-youtube[.]com__-"
default_scratchpad = "youtube"
default_focused = true

[[window_rule]]
match.app_id = "^chrome-music[.]youtube[.]com__-"
default_scratchpad = "youtube-music"
default_focused = true

[[window_rule]]
match.app_id = "^(md[.]obsidian[.]Obsidian|obsidian)$"
default_scratchpad = "obsidian"
default_focused = true

[[window_rule]]
match.app_id = "^discord$"
default_scratchpad = "discord"
default_focused = true

[[window_rule]]
match.app_id = "^localsend$"
default_scratchpad = "localsend"
default_focused = true

[[window_rule]]
match.app_id = "^chrome-x[.]com__compose_post-"
default_scratchpad = "x-post"
default_focused = true


"Mod+Alt+Left" = "column-focus-tab-previous"

# ---- Volume, brightness and media (nocta shows the OSD) ----
"XF86AudioRaiseVolume" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta brightness-down", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn playerctl stop", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true }

# ---- Screenshots (Noctalia) and recording ----

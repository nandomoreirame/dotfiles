# Umbriel (Noctalia team compositor): shared base config.
# config.toml includes this file, then the optional private.toml from the
# private overlay, which adds personal binds, rules, outputs and autostart.
# Based on /usr/share/umbriel/config.toml, with the niri binds and the
# Terminal Noir colors ported.

[environment]
# Flatpak export dirs (XDG_DATA_DIRS) come from the login shell: start-umbriel
# re-enters `zsh -l`, which sources /etc/profile.d/flatpak.sh.
GTK_IM_MODULE = "fcitx"
QT_IM_MODULE = "fcitx"
XMODIFIERS = "@im=fcitx"

# Umbriel starting configuration
#
# Copy this file to ~/.config/umbriel/config.toml. Most changes apply when the
# file is saved. Check edits with `umbriel config validate`.
#
# Complete reference: https://docs.noctalia.dev/umbriel/
#
# Commented settings below are examples, not built-in defaults.

# ==============================================================================
# Includes

# Optional split configuration
# https://docs.noctalia.dev/umbriel/configuration/#include
[include]
files = []

[include.optional]
files = []

# ==============================================================================
# General
# Optional session examples. XWayland support is enabled by default.
# https://docs.noctalia.dev/umbriel/configuration/#general
#
[general]
autostart = [
  "noctalia",
  "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
  "fcitx5",
  "solaar --window=hide",
  "$HOME/.dotfiles/bin/utils/niri-tray-autostart",
]
# xwayland = false
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
# xwayland_native_resolution = true
# Umbriel announces the X11 interface scale and cursor theme through XSETTINGS.
# Turn this off to run your own manager, such as xsettingsd.
# xwayland_xsettings = false
# Select the monitor X11 games use as primary, using a connector or monitor identity from `umbriel outputs`.
# xwayland_primary_output = "DP-1"
# NVIDIA outputs without explicit synchronization wait for GPU rendering by default.
# Disable this workaround if it causes stuttering or frame drops.
# nvidia_sync_workaround = false
# Modal dialogs hang on their parent window and follow it. Turn this off to keep them ordinary windows.
# attach_modal_dialogs = false

# ==============================================================================
# Lid events
# Remove the laptop panel from the desktop while the lid is closed, then
# restore it when the lid opens. Replace eDP-1 with the name from
# `umbriel outputs`.
# https://docs.noctalia.dev/umbriel/configuration/#events
#
# [events]
# lid_close = "umbriel msg output-disable eDP-1"
# lid_open = "umbriel msg output-enable eDP-1"

# ==============================================================================
# Screencast
# By default, the first target-changing action during an active share asks for
# confirmation. Disable that protection only if immediate keybind changes are
# preferred.
# https://docs.noctalia.dev/umbriel/configuration/#screencast
#
# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# Outputs
# Outputs are machine-specific. Run `umbriel outputs` to find names and modes.
# https://docs.noctalia.dev/umbriel/outputs/
#
# [output.DP-1]
# mode = "2560x1440@144"
# position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.
# color_profile = "edid" # Or a factory ICC path; with sdr_gamut = "srgb" a characterized panel describes itself to tagged clients.
# sdr_gamut = "srgb" # Map untagged SDR into the panel gamut; "native" stages no mapping.

# ==============================================================================
# Appearance
# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/umbriel/appearance/
#
# Terminal Noir (configs/noctalia/palettes/Terminal Noir.json), same look as
# niri: 1px hairline on every window, a 3px outer ring in outline grey that
# turns primary amber on the focused window (window rule below).
[colors]
background = "#0B0B0C"
text_primary = "#F4F4F5"
text_muted = "#A1A1AA"
accent_primary = "#F5A623"
accent_secondary = "#34D399"
warning = "#FACF9E"
error = "#FFB7B0"
shadow = "#00000080"
insert_hint = "#F5A62380"

[colors.border]
focused = "#222226"
unfocused = "#222226"
outer = "#3F3F46"

[colors.tab_bar]
background = "#18181B"
text = "#A1A1AA"
active = "#F5A623"
active_text = "#0B0B0C"
active_unfocused = "#3F3F46"
active_unfocused_text = "#F4F4F5"
urgent = "#FFB7B0"
urgent_text = "#0B0B0C"

[appearance]
border_width = 1
outer_border_width = 3
corner_radius = 6

[appearance.blur]
radius = 3

# Optional title bar with modifier-free dragging and floating frame resizing.
# [appearance.title_bar]
# mode = "on" # Follow client decoration preferences.
# Use "negotiated" to hide bars on Wayland windows that do not negotiate decorations.
# Use "forced" to always show bars, or "off" to hide them. Window rules can override this.
# height = 28
# font = "sans 10"
# title_align = "left" # "left", "center" (on the whole bar, clear of the buttons), or "right".
# button_position = "right" # or "left"
# buttons = ["minimize", "maximize", "close"] # From the title outward; leave one out to hide it.
# button_size = -1 # Diameter or side in logical pixels, 1 up to height; -1 derives it from height.
# button_gap = 8 # Space between neighbouring buttons.
# button_padding = -1 # Space between the button row and the bar edge: -1 matches the space above and below.
# button_corner_radius = -1 # Follow the window's corner_radius; 0 makes square buttons.
# button_glyph = "hover" # X, square, and underscore symbols: "always", "hover" (while hovered or pressed), or "never".
# button_glyph_size = -1 # Symbol side in logical pixels, 1 to 128; -1 spans half the button.
# button_glyph_stroke = -1 # Symbol stroke in logical pixels, 0.5 to 16; -1 is one twelfth of the button.
# button_background = true # Show colored backgrounds behind the symbols.

# Optional button palette. Glyph colors also apply when button backgrounds are off.
# [colors.title_bar]
# close = "#FF6B6BFF"
# close_glyph = "#141419FF"
# close_glyph_hover = "#141419FF"
# maximize = "#7AA3FFFF"
# maximize_glyph = "#141419FF"
# maximize_glyph_hover = "#141419FF"
# minimize = "#FFD166FF"
# minimize_glyph = "#141419FF"
# minimize_glyph_hover = "#141419FF"

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Effects
# Every effect is off until a preset is selected; border and window effects
# scale with overview zoom. Include a bundled preset (adjust /usr for the
# package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
#
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# For a cursor tail, include /usr/share/umbriel/effects/cursor/trail/effect.toml
# and set cursor = "trail" in [effects].
# For audio-reactive borders, include /usr/share/umbriel/effects/border/audio/effect.toml
# and set border = "audio" in [effects].
# Enable Noctalia's Umbriel audio provider in its shell settings, or supply an
# external effect-audio v2 producer with 64 spectrum bands. Umbriel does not capture audio.
# Pools accept matching presets defined/included separately. This one-member
# example uses the bundled pulse preset; add other border names to choose.
#
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first" # or round_robin, random
# Select with border = "borders" in your [effects] table.
# Add to your existing [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"
#
# [effects]
# border = "pulse"
# Draw the border on every decorated, non-urgent, non-fullscreen window, not
# just the focused one (overview cards included).
# border_unfocused = true
# For a screen effect only while an output is shared (a portal screen share or a
# screenshot), include /usr/share/umbriel/effects/screen/vignette/effect.toml and
# set screen_cast = "vignette" in [effects]; add in_capture = true for viewers to see it.

# ==============================================================================
# Input
# Enable NumLock for the first physical keyboard; later devices inherit current locks.
# https://docs.noctalia.dev/umbriel/input/
#
# [input]
#
[input.keyboard]
layout = "us,br"
variant = "intl,"
options = "compose:caps"
repeat_delay = 600
repeat_rate = 40
numlock_toggle = true

# Focus can follow the pointer across tiled, floating, and pinned windows.
#
# [input.focus]
# follows_mouse = "sloppy" # "off", "sloppy", or "always"; always also refocuses after layout and workspace changes.
# hover_raises = false # Hover focuses only; clicks and keybinds raise.

# Confine touch input to one display.
#
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]
# Ported from configs/niri/config.kdl (binds). Umbriel has no scratch
# workspace helper, screenshot action or wrap-around workspace switch, so those
# map to named scratchpads, Noctalia screenshots and workspace-next/previous.

"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }

# ---- Apps ----
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+Shift+Return" = { action = "spawn ghostty -e claude", repeat = false }
"Mod+Shift+B" = { action = "spawn google-chrome-stable", repeat = false }
"Mod+Shift+Alt+B" = { action = "spawn google-chrome-stable --incognito", repeat = false }
"Mod+Shift+F" = { action = "spawn nautilus --new-window", repeat = false }
"Mod+Shift+E" = { action = "spawn cursor", repeat = false }
"Mod+Shift+I" = { action = "spawn code", repeat = false }
"Mod+Shift+N" = { action = "spawn google-chrome-stable --app=https://notion.so", repeat = false }
"Mod+Shift+C" = { action = "spawn claude-desktop --password-store=gnome-libsecret", repeat = false }
"Ctrl+Shift+Space" = { action = "spawn 1password --quick-access", repeat = false }

# Scratchpads (show/hide; launch when empty). See [[scratchpad]] below.
"Mod+Shift+X" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle x-post", repeat = false }
"Mod+Shift+Y" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle youtube", repeat = false }
"Mod+Shift+U" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle youtube-music", repeat = false }
"Mod+Shift+O" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle obsidian", repeat = false }
"Mod+Shift+D" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle discord", repeat = false }
"Mod+Shift+L" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle localsend", repeat = false }
"Mod+Shift+S" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad toggle spotify", repeat = false }
"Mod+Alt+L" = { action = "spawn $HOME/.dotfiles/bin/utils/localsend-clip phone", repeat = false }


# TUIs and tools
"Mod+Alt+T" = { action = "spawn ghostty --class=btop-float -e btop", repeat = false }
"Mod+Alt+G" = { action = "spawn $HOME/.dotfiles/bin/utils/game-mode toggle", repeat = false }
"Mod+Alt+C" = { action = "spawn $HOME/.dotfiles/bin/utils/droidcam-ctl start", repeat = false }
"Mod+Alt+X" = { action = "spawn $HOME/.dotfiles/bin/utils/droidcam-ctl stop", repeat = false }

# Noctalia shell
# Launcher and clipboard history: Vicinae (replaces the Noctalia launcher).
"Mod" = "spawn vicinae toggle"
"Ctrl+Space" = { action = "spawn vicinae toggle", repeat = false }
"Mod+D" = { action = "spawn vicinae toggle", repeat = false }
"Mod+Alt+V" = { action = "spawn vicinae cmd launch clipboard:history", repeat = false }
"Ctrl+Mod+V" = { action = "spawn vicinae cmd launch clipboard:history", repeat = false }
"Mod+Ctrl+E" = { action = "spawn vicinae cmd launch core:search-emojis", repeat = false }
"Mod+Ctrl+F" = { action = "spawn vicinae cmd launch files:search", repeat = false }
"Mod+N" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta control-center", repeat = false }
"Mod+Alt+N" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta control-center", repeat = false }
"Mod+Comma" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta settings", repeat = false }
"Mod+Alt+Comma" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta settings", repeat = false }
"Mod+Alt+E" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta widgets-edit", repeat = false }
"Mod+Alt+Space" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta bar-toggle", repeat = false }
"Mod+Alt+B" = { action = "spawn $HOME/.dotfiles/bin/utils/noctalia-restart", repeat = false }
"Mod+Alt+W" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta wallpaper-random", repeat = false }
"Mod+L" = { action = "spawn $HOME/.dotfiles/bin/utils/nocta lock", repeat = false }

# Close and overview
"Ctrl+Q" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad close", repeat = false }
"Mod+Q" = { action = "spawn $HOME/.dotfiles/bin/utils/umbriel-scratchpad close", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }

# ---- Focus ----
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# ---- Move ----
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+Up" = "workspace-previous"
"Mod+Ctrl+Down" = "workspace-next"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# ---- Monitors ----
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"

# ---- Workspaces (next = down, previous = up, as in niri; no wrap) ----
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Tab" = "workspace-next"
"Mod+Shift+Tab" = "workspace-previous"
# Window switcher (Noctalia overlay). `hold` keeps it open while Alt is held;
# a quick tap jumps to the previous window. Workspaces stay on Mod+Tab.
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold all", repeat = false }
"Alt+Shift+Tab" = { action = "spawn noctalia msg window-switcher hold all reverse", repeat = false }
"Ctrl+Alt+Down" = "workspace-next"
"Ctrl+Alt+Up" = "workspace-previous"
"Ctrl+Alt+Right" = "workspace-next"
"Ctrl+Alt+Left" = "workspace-previous"

# Super + wheel scrolls between columns.
"Mod+WheelDown" = { action = "window-focus-right", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "window-focus-left", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

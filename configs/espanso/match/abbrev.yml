# Plain-word English abbreviations (no "." prefix).
# Language-specific packs (pt-BR, etc.) belong in the private overlay.
# word: true fires only on a whole word ("idk " expands, "idkfoo" does not);
# propagate_case: true keeps the capital ("Idk" -> "I don't know").

matches:
  - trigger: "idk"
    replace: "I don't know"
    word: true
    propagate_case: true

  - trigger: "imo"
    replace: "in my opinion"
    word: true
    propagate_case: true

  - trigger: "imho"
    replace: "in my humble opinion"
    word: true
    propagate_case: true

  - trigger: "tbh"
    replace: "to be honest"
    word: true
    propagate_case: true

  - trigger: "np"
    replace: "no problem"
    word: true
    propagate_case: true

  - trigger: "ty"
    replace: "thank you"
    word: true
    propagate_case: true

  - trigger: "yw"
    replace: "you're welcome"
    word: true
    propagate_case: true

  - trigger: "brb"
    replace: "be right back"
    word: true
    propagate_case: true

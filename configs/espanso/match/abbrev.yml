# Plain-word abbreviations (no "." prefix), like the iPhone ones.
# word: true fires only on a whole word ("vc " expands, "vcard" does not);
# propagate_case: true keeps the capital ("Vc" -> "Você").

matches:
  - trigger: "hj"
    replace: "hoje"
    word: true
    propagate_case: true

  - trigger: "tbm"
    replace: "também"
    word: true
    propagate_case: true

  - trigger: "tbom"
    replace: "tabom"
    word: true
    propagate_case: true

  - trigger: "td"
    replace: "tudo"
    word: true
    propagate_case: true

  - trigger: "tdb"
    replace: "tudo bom"
    word: true
    propagate_case: true

  - trigger: "vc"
    replace: "você"
    word: true
    propagate_case: true

  - trigger: "vcs"
    replace: "vocês"
    word: true
    propagate_case: true

  - trigger: "vdd"
    replace: "verdade"
    word: true
    propagate_case: true

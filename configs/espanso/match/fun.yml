# Expressions and jokes (iPhone-style text replacements).
# Language-specific jokes belong in the private overlay.

matches:
  - trigger: ".kk"
    left_word: true
    replace: "kkkkkkkkkkkkkkkkkkkkkkkkk"

  - trigger: ".hua"
    left_word: true
    replace: "HAHAHAHAHAHAHAHAHAHAHAHA"

  - trigger: ".lol"
    left_word: true
    replace: "lololololololololololol"

  - trigger: ".flip"
    left_word: true
    replace: "(╯°□°)╯︵ ┻━┻"

  - trigger: ".ue"
    left_word: true
    replace: '¯\_(ツ)_/¯'

  - trigger: ".tbh"
    left_word: true
    replace: "to be honest"

  - trigger: ".idk"
    left_word: true
    replace: "I don't know"

  - trigger: ".wtf"
    left_word: true
    replace: "what the fuck"

  - trigger: ".ty"
    left_word: true
    replace: "thank you"

  - trigger: ".np"
    left_word: true
    replace: "no problem"

  - trigger: ".omw"
    left_word: true
    replace: "on my way"

  - trigger: ".brb"
    left_word: true
    replace: "be right back"

  - trigger: ".cat"
    left_word: true
    replace: "Schrodinger's cat"
